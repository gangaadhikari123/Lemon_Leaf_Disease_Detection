name: frontend
description: "Lemon Leaf Disease Detection App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP requests to Django API
  http: ^1.2.0

  # Image picking — handles mobile + web
  image_picker: ^1.0.7
  image_picker_for_web: ^3.0.1

  # File picking — handles desktop (Linux, Windows, macOS)
  # File handling
  path_provider: ^2.1.2
  path: ^1.9.0

  # UI components
  flutter_spinkit: ^5.2.0
  cached_network_image: ^3.3.1
  percent_indicator: ^4.2.3
  lottie: ^3.1.0

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.2.3

  # Internationalization
  intl: ^0.20.2

  # Icons
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true